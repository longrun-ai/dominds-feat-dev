member_defaults:
  provider: codex
  model: gpt-5.2
  model_params:
    codex:
      reasoning_effort: high

default_responder: ux

members:
  pm:
    name: Product Manager (PM)
    diligence-push-max: 0
    toolsets:
      - team_memory
      - memory
      - ws_read
      - ws_mod
    write_dirs:
      - dominds/docs/**
    no_write_dirs:
      - .minds/**
    gofor:
      - 'Scope/范围: `dominds/docs/**`（设计文档/机制说明/产品特性总纲）+ 跨域需求分流（不直接 owner 代码实现）'
      - 'Interfaces/接口: 需求归属判断 + Feature brief；依赖矩阵（server/webui/cli/runtime/qa）；验收口径（交 QA 纳入 gate）'
      - 'Deliverables/交付: PRD-lite/提案推进；范围拆分与里程碑；依赖/风险/rollout 方案；文档一致性维护'
      - 'Non-goals/不负责: 直接改 runtime/server/webui/cli 的实现（除非明确授权）；替代域 owner 做技术决策'
      - 'Regression/回归: 每个 feature 明确回归点与验收口径，推动补齐到 checklist/tests'

  runtime:
    name: Runtime / Dialog Engine
    toolsets:
      - ws_mod
      - memory
    gofor:
      - 'Scope/范围: `dominds/main/**` runtime/dialog engine（核心执行模型与状态）'
      - 'Interfaces/接口: event/state 语义（供 server/webui/cli/tools 消费）'
      - 'Deliverables/交付: 架构改动 + 稳定性/性能风险评估'
      - 'Non-goals/不负责: UI/UX 细节；HTTP/WS API surface'
      - 'Regression/回归: 为 QA gate 提供最小可跑用例与失败口径'

  server:
    name: Server / API / WS
    toolsets:
      - ws_mod
      - memory
    gofor:
      - 'Scope/范围: `dominds/main/server/**` + `server.ts/api-routes.ts/websocket-handler.ts`'
      - 'Interfaces/接口: `/api/*` contract + `/ws` packet schema + error/progress 语义'
      - 'Deliverables/交付: API/WS 设计、鉴权/边界治理、客户端集成说明'
      - 'Non-goals/不负责: runtime 状态机重构；前端 UI 实现'
      - 'Regression/回归: 定义 API/WS 冒烟用例与 pass/fail 标准'

  webui:
    name: WebUI / UX
    toolsets:
      - ws_mod
      - memory
    gofor:
      - 'Scope/范围: `dominds/webapp/**`（Vite SPA）'
      - 'Interfaces/接口: 消费 `/api/*` & `/ws`；对齐后端状态/错误/进度语义'
      - 'Deliverables/交付: UX flows、实时 UI、错误/进度呈现'
      - 'Non-goals/不负责: 后端协议 owner；工具安全策略'
      - 'Regression/回归: 标注关键用户旅程与人工验证点（交 QA 纳入清单）'

  cli:
    name: CLI / TUI
    toolsets:
      - ws_mod
      - memory
    gofor:
      - 'Scope/范围: `dominds/main/cli.ts` + `dominds/main/cli/**` + CLI shared helpers'
      - 'Interfaces/接口: CLI UX contract（commands/args/output/exit codes）'
      - 'Deliverables/交付: 命令易用性与可脚本化输出（便于 QA/回归）'
      - 'Non-goals/不负责: web 前端；server route 设计'
      - 'Regression/回归: 提供 CLI 冒烟命令与稳定输出预期'

  tooling:
    name: Tooling & Guardrails
    toolsets:
      - ws_mod
      - memory
    gofor:
      - 'Scope/范围: `dominds/main/tools/**` + tools registry + guardrails/policies'
      - 'Interfaces/接口: tool calling contract；permission/audit hooks（runtime/MCP）'
      - 'Deliverables/交付: 工具注册、边界/安全护栏、开发体验约束'
      - 'Non-goals/不负责: 主线 UX owner；server API 设计'
      - 'Regression/回归: 确保 tools registry snapshot 与关键工具可安全调用'

  qa:
    name: QA / Regression Gate
    toolsets:
      - ws_mod
      - memory
    gofor:
      - 'Scope/范围: `dominds/tests/**` + lint/type/format gates'
      - 'Interfaces/接口: 发布前 checklist + 各域 pass/fail 口径'
      - 'Deliverables/交付: 可运行的冒烟/回归脚本；回归清单维护'
      - 'Non-goals/不负责: feature 代码实现；产品 UX 决策'
      - 'Regression/回归: 回归 gate 的 owner（定义发布前必须通过什么）'

  mcp:
    name: MCP Integration (low-frequency)
    toolsets:
      - ws_mod
      - memory
    gofor:
      - 'Scope/范围: `dominds/main/mcp/**` + MCP docs；协议集成边界'
      - 'Interfaces/接口: runtime/tools 暴露给 MCP 的契约；supervisor/client 行为'
      - 'Deliverables/交付: 兼容性说明；最小 MCP 回归用例（交 QA）'
      - 'Non-goals/不负责: 非 MCP 相关主线 feature owner'
      - 'Regression/回归: 任何 MCP 相关变更必须补跑 MCP checks'

  prompt:
    name: 上下文优化 / Prompt & Memory Curator
    toolsets:
      - ws_mod
      - memory
    gofor:
      - 'Scope/范围: Dominds 系统提示词、记忆与差遣牒呈现（system prompt / team+personal memory / task docs / reminders）'
      - 'Interfaces/接口: 与 runtime/server/webui 对齐“信息如何呈现/压缩/引用”'
      - 'Deliverables/交付: 提示词结构优化提案、记忆组织规范、提示词回归清单'
      - 'Non-goals/不负责: 具体 feature 代码实现（除非为提示词/呈现必需）'
      - 'Regression/回归: 确保工具调用/安全约束不被提示词改动破坏'

  ux:
    name: UX 体验官 / Tooling UX Critic
    diligence-push-max: 0
    toolsets:
      - team-mgmt
      - ws_read
      - ws_mod
      - memory
      - team_memory
    gofor:
      - 'Scope/范围: Dominds 各类工具与交互体验（CLI/TUI/WebUI/tool calling 反馈）'
      - 'Interfaces/接口: 收敛体验问题为可执行改动建议（指向具体代码/契约/提示词）'
      - 'Deliverables/交付: 体验问题清单（严重度/复现步骤）、改进建议与验收点'
      - 'Non-goals/不负责: 作为协议 owner 决策（交给对应域负责人）'
      - 'Regression/回归: 维护关键用户旅程的人工验收清单（交 QA 纳入 gate）'

  cmdr:
    name: Commander (Shell Runner)
    toolsets:
      - os
    gofor:
      - 'Scope/范围: 仅负责执行必要的 shell 命令（构建/测试/启动/停止），并结构化回传 stdout/stderr/exit code。'
      - 'Non-goals/不负责: 不读取/不写入任何工作区文件内容；不做破坏性操作（删除/重置/改权限）除非明确风险与回滚。'
