member_defaults:
  diligence-push-max: 0

  # provider: codex
  # # model: gpt-5.3-codex
  # # model: gpt-5.2-codex
  # model: gpt-5.2
  # model_params:
  #   codex:
  #     reasoning_effort: high

  # provider: minimaxi.com-coding-plan
  provider: minimaxi.com
  model: MiniMax-M2.5
  model_params:
    anthropic:
      temperature: 0.2
  fbr_model_params:
    anthropic:
      temperature: 1.0

default_responder: ux
shell_specialists: cmdr

members:
  ux:
    name: UX 体验官 / Tooling UX Critic
    toolsets:
      - '*'
      - '!os'

  cmdr:
    name: Commander (Shell Runner)
    toolsets:
      - os
    gofor:
      - 'Scope/范围: 仅负责执行必要的 shell 命令（构建/测试/启动/停止），并结构化回传 stdout/stderr/exit code。'
      - 'Non-goals/不负责: 不读取/不写入任何工作区文件内容；不做破坏性操作（删除/重置/改权限）除非明确风险与回滚。'
    # provider: minimaxi.com-coding-plan
    # model: MiniMax-M2.1
