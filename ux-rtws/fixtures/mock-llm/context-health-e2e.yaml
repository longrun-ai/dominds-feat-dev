responses:
  # High usage: should trigger reminder + caution/critical indicator.
  - message: 'hi-high'
    role: 'user'
    response: 'ok'
    usage:
      promptTokens: 2500
      completionTokens: 50

  # Low usage: should clear the owned reminder via context_health ReminderOwner.
  - message: 'ok-low'
    role: 'user'
    response: 'ok'
    usage:
      promptTokens: 1500
      completionTokens: 20

  # Usage unavailable: should show 'unknown' in the UI indicator.
  - message: 'hi-unknown'
    role: 'user'
    response: 'ok'
    usageUnavailable: true
